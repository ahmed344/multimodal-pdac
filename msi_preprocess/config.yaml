# Counts already contain acquisition RMS normalization. Thresholds below are
# operational screens, not estimates of an instrumental noise floor.
lesion_input: data/PDAC/Raw/adata_assembled.h5ad
tissue_input: data/PDAC/Raw/adata_assembled_tissue.h5ad
output: data/PDAC/Processed/msi_preprocess
dann_config: dann/config.yaml
patient_column: patient
# Manual QC from signal summaries and heatmaps; technical cause is unconfirmed.
exclude_slides:
  549857-19: Severely depleted lesion spectra (manual QC).
  549857-22: Severely depleted lesion spectra (manual QC).
  546332-17: Spatial striping (manual QC; previously referenced as 549332-17).
coordinate_columns:
  batch_column: batch
  x_column: x
  y_column: y
stages:
  selection: true
  integration: true
  local: true
selection:
  weak_intensity_screen: 0.5
  weak_fraction_screen: 0.5
  spatial_weak_excess: 0.02
  spatial_support_excess: 0.10
  min_spatial_detections: 100
  spatial_pairs: 20000
  shuffles: 20
  patch_pixels: 4
integration:
  prevalence: 0.10
  slide_fraction: 0.80
  support_fraction: 0.50
  min_anchors: 32
  multiplier_min: 0.5
  multiplier_max: 2.5
local:
  weak_boundary: 0.5
  sensitivity: [0.1, 0.2, 0.3, 0.5, 1.0]
  draws: 1024
  envelope: 0.95
  min_neighbors: 2
seed: 42
block_rows: 8192
feature_block: 32
application_workers: 4  # Bounded independent feature blocks; numerical results do not change.
memory_gib: 16
disk_reserve_gib: 4
report_peaks: 6
report:
  pixels_per_slide: 100
  max_peaks: 500  # Display only: retained peaks ranked by sampled log1p-count variance.
  upper_percentile: 99.5
