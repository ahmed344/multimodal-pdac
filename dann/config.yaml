data:
  path: /workspaces/multimodal-pdac/data/PDAC/Raw/adata_assembled.h5ad  # Input AnnData file.
  matrix_key: X  # Sparse MSI source: X or layers/<layer_name>.
  batch_column: batch  # Observation column used as the adversarial batch label.
  target_columns: [Density_CD8, Density_Tumor, Density_Collagen, Density_Stroma]  # Ordered IHC density targets.
  train_fraction: 0.80  # Batch-stratified fraction used for model fitting.
  validation_fraction: 0.10  # Batch-stratified fraction used for validation.
  test_fraction: 0.10  # Batch-stratified fraction reserved for final analysis.
  intensity_transform: log1p  # Log-transform every nonzero MSI intensity before model input.
  intensity_clip_max: null  # Optional upper clip after transformation; null disables clipping.
  nonzero_threshold: 0.0  # Values at or below this threshold are excluded.
  max_train_samples: null  # Optional stratified training cap; null uses every row.
  max_validation_samples: null  # Optional stratified validation cap for practical evaluation.
  max_test_samples: null  # Optional stratified test cap for practical analysis.

model:
  num_peaks: 5808  # Number of aligned m/z bins.
  embedding_dim: 128  # Width of each learned peak embedding.
  peak_hidden_dims: [512, 512]  # Hidden widths of the per-peak MLP.
  peak_output_dim: 512  # Per-peak representation width before mean pooling.
  aggregation_hidden_dims: [512, 512]  # Hidden widths after permutation-invariant pooling.
  latent_dim: 256  # Shared biology-predictive, batch-invariant latent width.
  biology_hidden_dims: [256, 128]  # Hidden widths of the ZILN biology predictor.
  discriminator_hidden_dims: [256, 128]  # Hidden widths of the batch discriminator.
  activation: gelu  # MLP activation: relu, gelu, silu, or leaky_relu.
  dropout: 0.10  # Dropout probability in all hidden MLP layers.
  use_layer_norm: true  # Apply LayerNorm after hidden linear layers.
  sigma_min: 0.0001  # Positive floor added to predicted ZILN standard deviations.

loss:
  ziln_reduction: mean  # Reduction over pixels and targets: mean or sum.
  target_weights: [16.0, 4.0, 2.0, 1.0]  # Relative weights in target_columns order.
  logit_epsilon: 0.000001  # Clamp for positive targets before the logit transform.
  include_normal_constant: false  # Keep false to reproduce the PDF loss exactly.
  biology_weight: 5.0  # Multiplier for the complete four-target ZILN loss.
  batch_weight: 1.0  # Multiplier for discriminator cross-entropy.
  balance_batch_classes: true  # Use inverse-frequency discriminator class weights.

training:
  seed: 20260719  # Global NumPy/PyTorch split and initialization seed.
  device: cuda  # Runtime device: auto, cpu, cuda, or cuda:<index>.
  epochs: 1000  # Maximum training epochs.
  batch_size: 2048  # Number of sparse pixels per optimizer step.
  validation_batch_size: 4096  # Number of sparse pixels per validation step.
  num_workers: 20  # DataLoader workers; each opens its own read-only HDF5 handle.
  prefetch_factor: 4  # Batches prefetched by each worker.
  pin_memory: true  # Pin host tensors when CUDA is available.
  learning_rate: 0.01  # AdamW learning rate.
  weight_decay: 0.00001  # AdamW decoupled weight decay.
  beta1: 0.9  # AdamW first-moment coefficient.
  beta2: 0.999  # AdamW second-moment coefficient.
  gradient_clip_norm: 5.0  # Maximum global gradient norm; null disables clipping.
  grl_max_lambda: 0.25  # Maximum encoder-bound gradient reversal strength.
  grl_schedule: dann  # GRL schedule: constant, linear, or dann logistic ramp.
  grl_gamma: 10.0  # Steepness of the DANN logistic GRL schedule.
  early_stopping_patience: 50  # Epochs without validation biology improvement before stopping.
  early_stopping_min_delta: 0.0001  # Required validation biology improvement.
  checkpoint_every: 1  # Save a latest checkpoint every this many epochs.
  resume_checkpoint: null  # Optional checkpoint path from which to resume.
  deterministic_algorithms: false  # Request deterministic PyTorch algorithms when possible.
  output_dir: /workspaces/multimodal-pdac/data/PDAC/Results/dann  # Checkpoints, histories, and figures.
  smoke_train_samples: 2048  # Real-data training rows used by --smoke-test.
  smoke_validation_samples: 512  # Real-data validation rows used by --smoke-test.
  smoke_test_samples: 512  # Real-data test rows used by --smoke-test.
  smoke_epochs: 1  # Epoch count used by --smoke-test.
  smoke_num_workers: 0  # Worker count used by --smoke-test for portability.

analysis:
  checkpoint: null  # Checkpoint to analyze; null selects output_dir/best.pt.
  split: test  # Data split used for latent and prediction plots.
  ziln_scatter_split: validation  # Held-out split used for the ZILN density validation scatter.
  max_samples: 100000  # Stratified cap for latent extraction and UMAP.
  batch_size: 512  # Sparse pixels per inference step.
  num_workers: 4  # DataLoader workers used during inference.
  umap_neighbors: 30  # UMAP neighborhood size.
  umap_min_dist: 0.30  # UMAP minimum-distance parameter.
  umap_metric: cosine  # Distance metric used by UMAP.
  umap_random_state: 20260719  # UMAP reproducibility seed.
  activity_chunk_size: 5000000  # Sparse values processed per peak-activity chunk.
  activity_max_nonzeros: null  # Optional sparse-value scan cap; null computes exact full-data activity.
  heatmap_top_peaks: 200  # Most frequently active peaks shown in the heatmap.
  family_count: 20  # Number of hierarchical cosine peptide families.
  clustering_linkage: average  # Hierarchical linkage for embedding cosine distances.
  figure_dpi: 300  # Resolution of saved PNG figures.
  point_size: 0.1  # Marker size in UMAP and validation scatter plots.
  density_cmap: jet  # Continuous colormap for density-colored UMAP panels.
  density_vmin_percentile: 1.0  # Lower percentile used for density UMAP color limits.
  density_vmax_percentile: 99.0  # Upper percentile used for density UMAP color limits.
  output_dir: /workspaces/multimodal-pdac/data/PDAC/Results/dann/analysis  # Analysis tables and figures.
