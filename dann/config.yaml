# DANN configuration. Keep editable settings here; resolved_config.yaml records
# the selected execution mode, effective settings, and derived output paths.
# All-MLP aggregation/heads select pixel mode; any CNN selects spatial mode.

latent_variance:
  # Reads existing spatial latents; input and output paths follow the selected run.
  slide_column: batch  # Observation column defining slides for variance decomposition.
  chunk_size: 8192  # Exported latent rows read per chunk; covariance uses float64.
  figure_dpi: 300  # Resolution of the explained-variance PNG.

data:
  path: /workspaces/multimodal-pdac/data/PDAC/Raw/adata_assembled.h5ad  # Sole source of supervised spectra, neighborhoods, labels, and split masks.
  context_path: /workspaces/multimodal-pdac/data/PDAC/Raw/adata_assembled_tissue.h5ad  # Inference-only input; never used by supervised training, validation, or test.
  matrix_key: X  # CSR source: X or layers/<layer_name>; feature order must match across files.
  batch_column: batch  # Slide identity for splitting, grid alignment, and adversarial labels; never a model input.
  x_column: x  # Integer grid coordinate; (batch, x, y) must be unique in each file.
  y_column: y  # Integer grid coordinate; gaps and missing tissue are preserved.
  target_columns: [Density_CD8, Density_Tumor, Density_Collagen, Density_Stroma]  # Target order also defines loss-weight and output-column order.
  cd8_normalization:
    enabled: true  # Divide CD8 density by non-tumor area; other targets are unchanged.
    min_non_tumor_fraction: 0.01  # Inclusive eligibility threshold; ratios above one also lose CD8 supervision.
  train_fraction: 0.80  # Seeded within-slide training fraction.
  validation_fraction: 0.10  # Withheld labels used for checkpoint selection.
  test_fraction: 0.10  # Withheld labels reserved for final analysis; never refitted.
  intensity_transform: log1p  # Transform stored MSI intensities: none, log1p, or sqrt.
  intensity_clip_max: null  # Optional upper clip after transformation; null disables clipping.
  nonzero_threshold: 0.0  # A positive threshold filters raw intensities before transformation; zero preserves original stored-entry handling.
  max_train_samples: null  # Optional stratified cap on training labels; spatial context remains complete.
  max_validation_samples: null  # Optional stratified cap on validation labels.
  max_test_samples: null  # Optional stratified cap on test labels.

model:
  num_peaks: 5808  # Number of aligned m/z bins in both MSI files.
  latent_dim: 256  # Aggregation output width; this is the exported latent before either head.

  # 1. Per-pixel spectral processing: learned embeddings -> intensity weighting
  #    -> per-peak MLP -> mean pooling over active peaks. Empty spectra pool to zero.
  spectral_encoder:
    type: deep_sets  # Supported spectral encoder: deep_sets.
    deep_sets:
      embedding_dim: 128  # Width of each learned peak embedding.
      peak_hidden_dims: [256, 256]  # Hidden widths of the original per-peak MLP.
      peak_output_dim: 256  # Pooled pixel width passed to the aggregation component.

  # 2. Latent aggregation: choose the original pointwise MLP or local spatial CNN.
  aggregation:
    type: mlp  # Choices: mlp, cnn. Only the selected component's settings are used.
    mlp:
      hidden_dims: [256, 256]  # Hidden widths after pooling; final width is latent_dim.
    cnn:
      channels: 128  # Pointwise input projection and hidden convolution width.
      depth: 3  # Number of 3x3, stride-one convolutions; spatial radius equals depth.
      dropout: 0.10  # Hidden dropout after per-pixel channel LayerNorm and GELU.

  # 3. Prediction heads: choices are independent; both consume aggregation latents.
  heads:
    biology:
      type: cnn  # Choices: mlp, cnn. Emits three raw ZILN parameters per target.
      mlp:
        hidden_dims: [256, 128, 64]  # Original pointwise biology-head hidden widths.
      cnn:
        channels: 128  # Hidden spatial width; final pointwise projection emits target parameters.
        depth: 3  # Neighborhood radius in latent-grid pixels.
        residual: true  # Disabling may prevent learning: the tested plain CNN collapsed pixel-to-pixel feature variation.
        dropout: 0.10  # Hidden dropout; normalization is per pixel, never across the tile.

    discriminator:
      type: mlp  # Choices: mlp, cnn. Predicts batch class from gradient-reversed latents.
      mlp:
        hidden_dims: [256, 128, 64]  # Original batch-discriminator hidden widths.
      cnn:
        channels: 128  # Hidden spatial width; final projection emits batch-class logits.
        depth: 3  # Neighborhood radius; included when deriving the required halo.
        dropout: 0.10  # Hidden dropout; missing tissue is masked throughout every CNN.

  # Shared MLP numerics and ZILN output transformation; CNN settings are above.
  activation: gelu  # MLP activation: relu, gelu, silu, or leaky_relu.
  dropout: 0.10  # Hidden dropout in Deep Sets and every selected MLP component.
  use_layer_norm: true  # LayerNorm after each hidden MLP linear layer.
  sigma_min: 0.0001  # Positive floor in sigma = softplus(raw_sigma) + sigma_min.

  # Execution controls change memory use, not the selected architecture.
  spectral_peak_budget: 65536  # Spatial spectral microbatch budget in active peaks; complete spectra stay together.
  spectral_checkpointing: true  # Recompute spectral activations during spatial backward, preserving dropout RNG.
  inference_peak_chunk_size: 262144  # Maximum peaks per inner no-gradient encoder chunk; spatial mode also uses the budget above.

loss:
  ziln_reduction: mean  # Reduction over valid weighted target entries: mean or sum.
  target_weights: [8.0, 4.0, 2.0, 1.0]  # Relative weights in data.target_columns order.
  logit_epsilon: 0.00001  # Clamp positive target densities before taking their logits.
  include_normal_constant: false  # Preserve the original loss scale by omitting the normal-density constant.
  biology_weight: 5.0  # Multiplier for the complete weighted four-target ZILN objective.
  batch_weight: 1.0  # Multiplier for discriminator cross-entropy.
  balance_batch_classes: true  # Mean-one inverse-frequency weights from selected training rows.

training:
  seed: 20260719  # Seed for data splits, initialization, and loader shuffling.
  device: cuda  # Runtime device: auto, cpu, cuda, or cuda:<index>.
  epochs: 300  # Maximum fitting epochs; validation/test labels are never included in a final refit.

  # Automatically selected execution settings. Edit these blocks rather than
  # adding competing top-level batch_size, learning_rate, or worker overrides.
  pixel:  # Used only when aggregation and both prediction heads are MLPs.
    batch_size: 2048  # Supervised sparse pixels per optimizer step.
    validation_batch_size: 4096  # Supervised sparse pixels per validation step.
    learning_rate: 0.01  # AdamW learning rate for pixel mode.
    num_workers: 20  # Read-only, process-local HDF5 data-loader workers.
    prefetch_factor: 4  # Batches prefetched per worker; used only when workers > 0.

  spatial:  # Used when any selected aggregation/head component is a CNN.
    core_size: 8  # Core side length in grid pixels; no edge pixels are discarded.
    sampling_strategy: proportional_slide_tiles  # Independently shuffled slide queues, proportional row interleaving.
    supervised_rows_per_batch: 2048  # Exact training row budget; final epoch batch may be smaller.
    tiles_per_batch: 8  # Validation/test tile count; also training count with legacy shuffled_tiles.
    learning_rate: 0.001  # AdamW learning rate for spatial mode; not automatically scaled with batch size.
    num_workers: 20  # Tile-reading workers; tiles shuffle across slides without requiring distinct slides.
    prefetch_factor: 4  # Tile batches prefetched per worker; larger batches also increase host-memory use.
    # Halo is derived: aggregation radius + max(biology radius, discriminator radius).
    # Default radii give halo 6, a 20x20 input, 13x13 biology support, and 7x7 latent support.
    # Only occupied, selected core rows supply labels; all occupied halo MSI remains context.

  # Shared optimization and adversarial schedule.
  pin_memory: true  # Pin loader tensors for host-to-CUDA transfers.
  weight_decay: 0.00001  # AdamW decoupled weight decay.
  beta1: 0.9  # AdamW first-moment coefficient.
  beta2: 0.999  # AdamW second-moment coefficient.
  gradient_clip_norm: 5.0  # Maximum global gradient norm; null disables clipping.
  grl_max_lambda: 0.25  # Maximum encoder-bound gradient reversal strength.
  grl_schedule: dann  # GRL schedule: constant, linear, or dann logistic ramp.
  grl_gamma: 10.0  # Steepness of the DANN logistic schedule.
  early_stopping_patience: 5  # Epochs without improvement in mean validation CD8 ZILN loss over valid CD8 rows.
  early_stopping_min_delta: 0.001  # Minimum improvement in that selection metric; training still uses all four targets.
  checkpoint_every: 1  # Save latest.pt every this many epochs; improvements also save best.pt.
  resume_checkpoint: null  # Optional checkpoint path; incompatible targets, components, or optimizer ordering are rejected.
  deterministic_algorithms: false  # Request deterministic PyTorch algorithms when possible.

  # --smoke-test overrides, recorded in resolved_config.yaml under a separate smoke/ run directory.
  smoke_train_samples: 2048  # Stratified cap on training labels; all labeled-file MSI context is retained.
  smoke_validation_samples: 512  # Stratified validation-label cap.
  smoke_test_samples: 512  # Stratified test-label and analysis cap.
  smoke_epochs: 1  # Epoch count for smoke training.
  smoke_num_workers: 0  # Worker count for smoke training and analysis.
  smoke_core_size: 8  # Spatial smoke core side length; the halo is still derived from component radii.
  smoke_tiles_per_batch: 2  # Spatial smoke evaluation tiles; training row budget remains unchanged.

analysis:
  split: test  # Saved checkpoint split used for latent/prediction analysis.
  ziln_scatter_split: validation  # Saved held-out split used for prediction scatter and additional calibration.
  max_samples: null  # Optional stratified cap within saved splits; null uses all saved rows.
  batch_size: 4096  # Pixel-mode tissue inference batch size; CNN inference uses the saved tiles_per_batch.
  num_workers: 4  # Analysis and tissue-inference workers; does not change training workers.
  density_mc_samples: 1000  # Hurdle draws per pixel/target, averaged to estimate unconditional density.
  density_mc_seed: 20260719  # Isolated Monte Carlo seed; tissue exports use row-keyed streams for cap invariance.
  umap_neighbors: 30  # UMAP neighborhood size.
  umap_min_dist: 0.30  # UMAP minimum-distance parameter.
  umap_metric: cosine  # Distance metric used for latent UMAP.
  umap_random_state: 20260719  # UMAP reproducibility seed.
  activity_chunk_size: 5000000  # Sparse values processed per peak-activity scan chunk.
  activity_max_nonzeros: null  # Optional activity-scan cap; null scans the full labeled dataset.
  heatmap_top_peaks: 200  # Most frequently active peaks shown in the embedding-similarity heatmap.
  family_count: 20  # Number of hierarchical cosine peak-embedding families.
  clustering_linkage: average  # Hierarchical linkage method for embedding cosine distances.
  figure_dpi: 300  # Resolution of saved analysis PNGs.
  point_size: 0.1  # Marker size in UMAP and validation scatter plots.
  density_cmap: jet  # Continuous colormap for density-colored UMAP panels.
  density_vmin_percentile: 1.0  # Lower percentile for density UMAP color limits.
  density_vmax_percentile: 99.0  # Upper percentile for density UMAP color limits.
  calibration_coverage_levels: [0.50, 0.90]  # Central positive-branch predictive intervals to score.
  calibration_pit_bins: 50  # Histogram bins for positive-branch probability-integral-transform diagnostics.
  exceedance_thresholds: []  # Optional density thresholds for P(y > t) summaries; empty disables them.

results:
  # All paths derive from root/<spectral>__agg-<type>__bio-<type>__disc-<type>/<run_name>/.
  # Subdirectories: model/, analysis/, analysis/spatial/, and latent_variance/.
  # Smoke runs insert smoke/ after run_name; CLI checkpoint/output overrides remain available.
  root: /workspaces/multimodal-pdac/data/PDAC/Results/dann  # Common results root for every combination.
  run_name: proportional-slide-tiles-8x8-2048  # Human-readable run name; separate experiments should use separate names.
