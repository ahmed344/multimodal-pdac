# Shared DANN settings. Training and analysis settings live in the linked files.
# resolved_config.yaml records the combined effective settings and derived paths.
# All-MLP aggregation/heads select pixel mode; any CNN or GATv2 selects spatial mode.
includes: [config_trainging.yaml, config_analysis.yaml]

data:
  preprocessing_fingerprint: "5afeec26a84e55ddace6f44fadd8dc3a1f344b1bed1d327c8bc531cf513c3f03"  # Changed inputs require fresh training.
  path: "/workspaces/multimodal-pdac/data/PDAC/Processed/msi_preprocess/lesion.h5ad"  # Cleaned lesion spectra; preprocessing used whole-tissue MSI image context.
  context_path: "/workspaces/multimodal-pdac/data/PDAC/Processed/msi_preprocess/tissue.h5ad"  # Matching cleaned whole tissue for inference; fitted parameters are frozen.
  he_features_key: hes_features  # Raw ordered UNI2-h targets in obsm.
  matrix_key: X  # CSR source: X or layers/<layer_name>; feature order must match across files.
  batch_column: batch  # Slide identity for splitting, grid alignment, and adversarial labels; never a model input.
  x_column: x  # Integer grid coordinate; (batch, x, y) must be unique in each file.
  y_column: y  # Integer grid coordinate; gaps and missing tissue are preserved.
  target_columns: [Density_CD8, Density_Tumor, Density_Collagen, Density_Stroma]  # Target order also defines loss-weight and output-column order.
  cd8_normalization:
    enabled: true  # Divide CD8 density by non-tumor area; other targets are unchanged.
    min_non_tumor_fraction: 0.01  # Inclusive eligibility threshold; ratios above one also lose CD8 supervision.
  train_fraction: 0.90  # Seeded within-slide training fraction.
  validation_fraction: 0.10  # Checkpoint selection and analysis; receives rounding remainders.
  test_fraction: 0.00  # Empty test split retained for checkpoint compatibility.
  intensity_transform: log1p  # Transform stored MSI intensities: none, log1p, or sqrt.
  intensity_clip_max: null  # Optional upper clip after transformation; null disables clipping.
  nonzero_threshold: 0.0  # A positive threshold filters raw intensities before transformation; zero preserves original stored-entry handling.
  max_train_samples: null  # Optional stratified cap on training labels; spatial context remains complete.
  max_validation_samples: null  # Optional stratified cap on validation labels.
  max_test_samples: null  # Optional stratified cap on test labels.

results:
  # Paths derive from root/<spectral>__agg-<type>__bio-<type>__disc-<type>[__he-<type>]/<run_name>/.
  # Subdirectories: model/, analysis/, analysis/spatial/, and analysis/latent_variance/.
  # Smoke runs insert smoke/ after run_name; CLI checkpoint/output overrides remain available.
  root: /workspaces/multimodal-pdac/data/PDAC/Results/dann  # Common results root for every combination.
  run_name: "peaks_embedding_8_deep_cca_d16_latent_128_all_0p01"  # Separate outputs for the provisional CCA choice.

model:
  num_peaks: 5023  # Number of aligned m/z bins in both MSI files.
  latent_dim: 128  # Aggregation output width; this is the exported latent before either head.

  # 1. Per-pixel spectral processing: learned embeddings -> intensity weighting
  #    -> per-peak MLP -> mean pooling over active peaks. Empty spectra pool to zero.
  spectral_encoder:
    type: deep_sets  # Supported spectral encoder: deep_sets.
    deep_sets:
      pooling: occurrence_mlp  # Or intensity_weighted_dictionary; requires fresh training.
      normalization: count  # occurrence_mlp: count; dictionary: l1 or l2 (transformed intensities).
      normalization_epsilon: 1.0e-8  # Positive row-norm floor for dictionary pooling.
      peak_mlp_residual: true  # Normalized skips around equal-width hidden blocks.
      pool_centering: zero_input  # occurrence: none/zero_input; dictionary: none/dictionary_mean.
      embedding_dim: 8  # Width of each learned peak embedding.
      peak_hidden_dims: [128, 128]  # Hidden widths of the original per-peak MLP.
      peak_output_dim: 128  # Pooled pixel width passed to the aggregation component.

  # 2. Latent aggregation: choose pointwise MLP, local CNN, or distance-based GATv2.
  aggregation:
    type: cnn  # Choices: mlp, cnn, gatv2. Only the selected component's settings are used.
    mlp:
      residual: true
      hidden_dims: [128, 128]  # Hidden widths after pooling; final width is latent_dim.
    cnn:
      channels: 128  # Pointwise input projection and hidden convolution width.
      depth: 3  # Number of 3x3, stride-one convolutions; spatial radius equals depth.
      residual: true  # Normalized skip connections within hidden 3x3 blocks; false restores the plain CNN.
      dropout: 0.10  # Hidden dropout after per-pixel channel LayerNorm and GELU.
    gatv2:
      channels: 128  # Total hidden width across concatenated heads; divisible by heads.
      depth: 3  # Number of local attention layers.
      heads: 4  # Each attention head emits channels / heads channels.
      neighbor_radius: 1.5  # Per-layer Euclidean cutoff in grid units; includes eight immediate neighbors.
      residual: true  # Independent normalized identity skip: (hidden + update) / sqrt(2).
      dropout: 0.10  # Hidden feature dropout after per-node LayerNorm and GELU.
      attention_dropout: 0.05  # Drop attention coefficients during training.

  # 3. Prediction heads: choices are independent; all consume aggregation latents.
  heads:
    biology:
      type: cnn  # Choices: mlp, cnn, gatv2. Emits three raw ZILN parameters per target.
      mlp:
        residual: true
        hidden_dims: [128, 64, 32]  # Original pointwise biology-head hidden widths.
      cnn:
        channels: 128  # Hidden spatial width; final pointwise projection emits target parameters.
        depth: 3  # Neighborhood radius in latent-grid pixels.
        residual: true  # Disabling may prevent learning: the tested plain CNN collapsed pixel-to-pixel feature variation.
        dropout: 0.10  # Hidden dropout; normalization is per pixel, never across the tile.
      gatv2:
        channels: 128  # Total hidden width across concatenated heads; divisible by heads.
        depth: 3  # Number of local attention layers.
        heads: 4  # Each attention head emits channels / heads channels.
        neighbor_radius: 1.5  # Per-layer Euclidean cutoff in grid units; includes eight immediate neighbors.
        residual: true  # Independent normalized identity skip: (hidden + update) / sqrt(2).
        dropout: 0.10  # Hidden feature dropout after per-node LayerNorm and GELU.
        attention_dropout: 0.05  # Drop attention coefficients during training.

    he:
      enabled: true  # Auxiliary within-slide CCA with UNI2-h features.
      objective: deep_cca  # Choices: raw_mse, deep_cca. Changing objectives requires fresh training.
      # Enabled by user choice despite missing the pilot's 1% promotion gate.
      deep_cca:
        dimension: 16
        msi_hidden_dim: 128
        he_hidden_dim: 256
        biology_only_epochs: 1  # CCA weight is zero; existing batch alignment remains active.
        ramp_epochs: 2  # Half weight in epoch 2, full weight from epoch 3.
      output_dim: 1536
      type: mlp  # Required for CCA; raw_mse also supports cnn and gatv2.
      # The mlp/cnn/gatv2 blocks below apply only to raw_mse; CCA uses deep_cca widths.
      mlp:
        residual: true
        hidden_dims: [256, 128, 64]  # Pointwise raw H&E prediction hidden widths.
      cnn:
        channels: 128  # Hidden spatial width; final pointwise projection emits target parameters.
        depth: 3  # Neighborhood radius in latent-grid pixels.
        residual: true  # Disabling may prevent learning: the tested plain CNN collapsed pixel-to-pixel feature variation.
        dropout: 0.10  # Hidden dropout; normalization is per pixel, never across the tile.
      gatv2:
        channels: 128  # Total hidden width across concatenated heads; divisible by heads.
        depth: 3  # Number of local attention layers.
        heads: 4  # Each attention head emits channels / heads channels.
        neighbor_radius: 1.5  # Per-layer Euclidean cutoff in grid units; includes eight immediate neighbors.
        residual: true  # Independent normalized identity skip: (hidden + update) / sqrt(2).
        dropout: 0.10  # Hidden feature dropout after per-node LayerNorm and GELU.
        attention_dropout: 0.05  # Drop attention coefficients during training.

    discriminator:
      enabled: false  # Omit the classifier and GRL; direct alignment uses ordinary backpropagation.
      type: mlp  # Choices: mlp, cnn, gatv2. Predicts batch class from gradient-reversed latents.
      mlp:
        residual: true
        hidden_dims: [256, 128, 64]  # Original batch-discriminator hidden widths.
      cnn:
        channels: 128  # Hidden spatial width; final projection emits batch-class logits.
        depth: 3  # Neighborhood radius; included when deriving the required halo.
        residual: true  # Independent of biology/aggregation residuals; false restores the plain CNN.
        dropout: 0.10  # Hidden dropout; missing tissue is masked throughout every CNN.
      gatv2:
        channels: 128  # Total hidden width across concatenated heads; divisible by heads.
        depth: 3  # Number of local attention layers.
        heads: 4  # Each attention head emits channels / heads channels.
        neighbor_radius: 1.5  # Per-layer Euclidean cutoff in grid units; includes eight immediate neighbors.
        residual: true  # Independent normalized identity skip: (hidden + update) / sqrt(2).
        dropout: 0.10  # Hidden feature dropout after per-node LayerNorm and GELU.
        attention_dropout: 0.05  # Drop attention coefficients during training.

  # Shared MLP numerics and ZILN output transformation; CNN settings are above.
  activation: gelu  # MLP activation: relu, gelu, silu, or leaky_relu.
  dropout: 0.10  # Hidden dropout in Deep Sets and every selected MLP component.
  use_layer_norm: true  # LayerNorm after each hidden MLP linear layer.
  sigma_min: 0.0001  # Positive floor in sigma = softplus(raw_sigma) + sigma_min.

  # Execution controls change memory use, not the selected architecture.
  gatv2_checkpointing: false  # Independent of spectral checkpointing; preserves parameter names.
  gatv2_tile_budget: 64  # Independent tile graphs per internal attention call; all neighbors and optimizer rows are retained.
  pixel_spectral_microbatching: false  # Opt in to bounded checkpointed pooling for wide MLP training.
  spectral_peak_budget: 524288  # Spatial spectral microbatch budget in active peaks; complete spectra stay together.
  spectral_checkpointing: true  # Recompute spectral activations during spatial backward, preserving dropout RNG.
  inference_peak_chunk_size: 262144  # Maximum peaks per inner no-gradient encoder chunk; spatial mode also uses the budget above.

loss:
  batch_alignment:
    nhsic: {enabled: true, weight: 0.01}  # Initial experimental weight, not an established optimum.
    anova: {enabled: true, weight: 0.01}
    soft_nn: {enabled: true, weight: 0.001}
    bandwidths: [0.05, 0.1, 0.2, 0.5]
    temperature: 0.1
    train_per_slide: 32
    validation_per_slide: 64
  ziln_reduction: mean  # Reduction over valid weighted target entries: mean or sum.
  target_weights: [8.0, 4.0, 2.0, 1.0]  # Relative weights in data.target_columns order.
  logit_epsilon: 0.00001  # Clamp positive target densities before taking their logits.
  include_normal_constant: false  # Preserve the original loss scale by omitting the normal-density constant.
  biology_weight: 1.0  # Multiplier for the complete weighted four-target ZILN objective.
  he_weight: 0.1  # Full H&E CCA coefficient; training ramps above, validation uses full weight.
  batch_weight: 1.0  # Finite, nonnegative discriminator cross-entropy weight; also scales the selection penalty.
  balance_batch_classes: true  # Mean-one inverse-frequency weights from selected training rows.
